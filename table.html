<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in html</title>
</head>
<body>
    <table>
        <caption>Pen Data</caption>
        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
        </tr>
        </thead>
      <tbody>
        <tr>
            <td>Ball Pen</td>
            <td>10</td>
            
        </tr>
        </tbody>

        <tfoot>
        <tr>
            <td>Gel Pen</td>
            <td>20</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
